<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | AR Investor's</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #0B0B0B;
      --gold: #D4AF37;
      --gold-light: #F5E3A1;
      --muted: #A89F86;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--gold-light);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .wrapper { max-width: 480px; }
    h1 {
      font-size: clamp(5rem, 20vw, 8rem);
      font-weight: 700;
      background: linear-gradient(135deg, #F5E3A1, #D4AF37, #9C7A1E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    h2 {
      font-size: 1.5rem;
      margin-top: 1rem;
      color: var(--gold-light);
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    p { color: var(--muted); margin-top: 1rem; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #F5E3A1, #D4AF37, #9C7A1E);
      color: #0B0B0B;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    a:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="wrapper" role="main">
    <h1 aria-label="404">404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved. Let us guide you back.</p>
    <a href="/">Return to Home</a>
  </div>
</body>
</html>
