    <line x1="50" y1="75" x2="50" y2="94" stroke="url(#hz-gold)" stroke-width="1" opacity="0.7" />
    <line x1="6" y1="50" x2="25" y2="50" stroke="url(#hz-gold)" stroke-width="1" opacity="0.7" />
    <line x1="75" y1="50" x2="94" y2="50" stroke="url(#hz-gold)" stroke-width="1" opacity="0.7" />
    <text x="50" y="58" text-anchor="middle" font-size="24" font-family="'Manrope', system-ui, sans-serif" font-weight="800" letter-spacing="1" fill="url(#hz-gold)">AR</text>
  </g>
  <!-- Wordmark -->
  <text x="72" y="32" font-family="'Manrope', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.04em" fill="url(#hz-gold)">AR Investor's</text>
  <text x="73" y="48" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="11" letter-spacing="0.08em" fill="#D4AF62" opacity="0.95">We Invest Where Others See Risk</text>
</svg>
