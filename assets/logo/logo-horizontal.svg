<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 64" fill="none">
  <defs>
    <linearGradient id="hz-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF0B8" />
      <stop offset="35%" stopColor="#D4AF62" />
      <stop offset="70%" stopColor="#F8DF87" />
      <stop offset="100%" stopColor="#B08D57" />
    </linearGradient>
  </defs>
  <!-- Diamond Emblem -->
  <g transform="translate(4, 4) scale(0.56)">
